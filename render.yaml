services:
  - type: web
    name: microdrama-promo-api
    runtime: python
    # Free plan: no persistent disk. Run state is ephemeral, which is fine
    # for a demo run (in-memory jobs die on restart anyway; the UI polls
    # during a run, keeping the instance awake). PF_PERSISTENT_STORAGE=1 is
    # required by the API to enable visitor jobs, even though the disk is
    # ephemeral.
    plan: free
    buildCommand: pip install -r requirements.txt
    # --forwarded-allow-ips '*' so uvicorn trusts X-Forwarded-Proto from
    # Render's proxy; otherwise the API sees plain HTTP and rejects job
    # starts (HTTPS check). Keep --workers 1 (job state is in-memory).
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1 --forwarded-allow-ips '*'
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: PF_REMOTE
        value: "1"
      - key: PF_PRIVATE
        value: "0"
      - key: PF_LIVE_ENABLED
        value: "0"
      - key: PF_VISITOR_KEYS_ENABLED
        value: "1"
      - key: PF_PERSISTENT_STORAGE
        value: "1"
      # Run dirs + budget ledger live here. Ephemeral on free (wiped on
      # spin-down/restart); must be outside the submission tree.
      - key: PF_RUNS_DIR
        value: /tmp/promo-web-runs
      - key: PF_SESSION_SECRET
        generateValue: true
      # Set to the exact GitHub Pages origin (scheme + host, no path/slash),
      # e.g. https://your-username.github.io . Enables CORS + cross-site cookies.
      - key: PF_ALLOWED_ORIGIN
        sync: false
